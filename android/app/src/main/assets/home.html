<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conductor</title>
<link rel="stylesheet" href="common.css">
<style>
body{background:var(--void)}
body::before{display:none}
#env{position:fixed;left:0;top:0;z-index:0;display:block}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 80% at 50% 30%,transparent 40%,rgba(9,9,10,.55) 100%),linear-gradient(to bottom,transparent 60%,rgba(9,9,10,.35))}
.shell{position:relative;z-index:2;padding:0 14px calc(var(--dock,92px) + 40px)}
/* top bar */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 4px 12px;margin:0 -14px;padding-left:18px;padding-right:14px;transition:background .5s}
.bar.solid{background:rgba(9,9,10,.86);backdrop-filter:blur(10px)}
.mark{display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px;letter-spacing:.01em}
.mark svg{width:22px;height:22px}
.bar-r{display:flex;align-items:center;gap:8px}
.clock{font-family:var(--f-data);font-size:12px;color:var(--mist);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.tag{font-family:var(--f-data);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);padding:10px 14px;border-radius:999px;background:rgba(239,237,232,.06);box-shadow:inset 0 0 0 1px var(--line)}
/* hero: what matters now */
.hero{margin-top:22vh;padding:22px 20px 20px;border-radius:30px}
.who{display:flex;align-items:center;gap:10px;font-family:var(--f-data);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--paper);box-shadow:0 0 12px rgba(239,237,232,.8);animation:beat 2.4s ease-in-out infinite;flex:none}
.ldot.crit{background:var(--signal);box-shadow:0 0 14px rgba(229,50,43,.9)}
.ldot.think{animation-duration:.9s}
@keyframes beat{50%{opacity:.35;transform:scale(.75)}}
h1.speak{font-weight:300;font-size:clamp(30px,9.2vw,46px);line-height:1.06;letter-spacing:-.035em;margin:14px 0 0;text-wrap:balance}
h1.speak .w{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(.25em);animation:word .9s var(--ease) forwards}
@keyframes word{to{opacity:1;filter:blur(0);transform:none}}
.sub{color:var(--mist);font-size:15.5px;margin:12px 0 0;opacity:0;animation:fade 1s .3s var(--ease) forwards}
@keyframes fade{to{opacity:1}}
.chain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:20px;position:relative}
.chain .ln{position:absolute;left:16px;right:16px;top:16px;height:1px;background:var(--line2);overflow:hidden;pointer-events:none}
.chain .ln i{position:absolute;top:-1px;width:60px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--paper));animation:travel 3.2s linear infinite}
@keyframes travel{from{left:-60px}to{left:100%}}
.st{display:flex;flex-direction:column;gap:6px;position:relative;opacity:0;animation:rise .9s var(--ease) forwards;text-align:left}
.st:nth-of-type(2){animation-delay:.12s}.st:nth-of-type(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.st b{display:flex;align-items:center;gap:8px;font-family:var(--f-data);font-weight:400;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash)}
.st b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--void);box-shadow:inset 0 0 0 1.5px var(--mist);margin:11px 0 11px 12px;flex:none}
.st.now b{color:var(--paper)}
.st.now b::before{background:var(--paper);box-shadow:0 0 0 4px rgba(239,237,232,.12),0 0 14px rgba(239,237,232,.6)}
.st.now.crit b::before{background:var(--signal);box-shadow:0 0 0 4px rgba(229,50,43,.16),0 0 14px rgba(229,50,43,.7)}
.st span{font-size:14px;line-height:1.3;color:var(--mist);padding:0 6px 0 12px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.st.now span{color:var(--paper)}
.checked{margin-top:16px;font-family:var(--f-data);font-size:10.5px;letter-spacing:.06em;color:var(--ash);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.checked i{font-style:normal;padding:3px 8px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line2)}
/* sections float up out of depth */
.sec{padding:40px 0 4px}
.sec>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 6px 14px}
.sec h2{margin:0;font-weight:300;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.sec .meta{font-family:var(--f-data);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ash)}
.reveal{opacity:0;transform:perspective(900px) translateZ(-140px) translateY(40px) rotateX(6deg);filter:blur(10px);transition:opacity 1.1s var(--ease),transform 1.2s var(--ease),filter 1.1s var(--ease)}
.reveal.in{opacity:1;transform:none;filter:none}
/* focus deck: swipe through depth */
.deck{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px calc(50% - min(41vw,230px)) 24px;margin:0 -14px;scrollbar-width:none;perspective:1000px}
.deck::-webkit-scrollbar{display:none}
.fc{flex:none;width:min(82vw,460px);min-height:250px;scroll-snap-align:center;border-radius:30px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:12px;transform-style:preserve-3d;will-change:transform,filter}
.fc .eye{display:flex;justify-content:space-between;gap:10px;align-items:center;font-family:var(--f-data);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ash)}
.state{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:rgba(239,237,232,.06);color:var(--mist);white-space:nowrap}
.state i{width:6px;height:6px;border-radius:50%;background:currentColor}
.state.crit{background:rgba(229,50,43,.16);color:#ff8a84}.state.crit i{background:var(--signal);box-shadow:0 0 8px var(--signal)}
.fc h3{margin:2px 0 0;font-weight:400;font-size:24px;line-height:1.18;letter-spacing:-.015em;text-wrap:balance}
.fc p{margin:0;color:var(--mist);font-size:14.5px}
.fc .foot{margin-top:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.card.alert{box-shadow:inset 0 1px 0 rgba(255,140,132,.25),inset 0 0 0 1px rgba(229,50,43,.25),0 30px 70px -30px rgba(229,50,43,.35)}
.card.alert::before{background:linear-gradient(180deg,rgba(255,130,120,.6),rgba(255,130,120,.06) 40%,rgba(255,130,120,.05) 60%,rgba(255,130,120,.3))}
.dots{display:flex;justify-content:center;gap:6px;margin-top:-4px}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--line2);transition:width .4s var(--ease),background .4s}
.dots i.on{width:22px;background:var(--paper)}
.draft{background:rgba(9,9,10,.5);box-shadow:inset 0 0 0 1px var(--line2);border-radius:16px;padding:12px 14px;white-space:pre-wrap;font-size:14px;color:var(--paper);max-height:180px;overflow:auto}
/* lenses */
.lens{margin:0 0 14px;padding:18px 20px 18px;border-radius:28px;transition:transform .18s,box-shadow .18s,opacity .18s;touch-action:pan-y}
.lh{display:flex;align-items:center;gap:8px;margin:0 0 10px;user-select:none;-webkit-user-select:none}
.lh .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 10px currentColor}
.lh .k{flex:1;text-align:right;font-family:var(--f-data);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
.lh .grip{color:#8f8e8a88;font-size:15px;letter-spacing:-2px;padding:4px 0 4px 8px}
.lens.lift{z-index:30;transform:scale(1.02);box-shadow:0 18px 40px #000c,0 0 40px -10px rgba(160,190,255,.4);opacity:.97}
.ln-title{font-size:23px;font-weight:400;letter-spacing:-.015em;line-height:1.2;margin:2px 0 4px}
.agent{font-size:13.5px;color:var(--mist);margin:0 0 6px;display:flex;gap:8px}
.agent::before{content:"✦";color:var(--ash)}
.big{font-size:64px;font-weight:300;letter-spacing:-.04em;line-height:1;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--ash);letter-spacing:0;margin-left:8px}
.rowi{display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.rowi:first-child{border-top:0}
.rowi .tm{flex:none;width:50px;font:500 14px var(--f-data);color:var(--paper);padding-top:1px}
.rowi .b{flex:1;min-width:0}
.rowi .s{font-size:13px;color:var(--ash);margin-top:1px}
.crit{color:#ff8a83}.okc{color:var(--ok)}.warnc{color:var(--warn)}
.onl{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-data);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#bcd0ff}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{border-radius:12px;padding:7px 0 6px;text-align:center;background:rgba(239,237,232,.04);box-shadow:inset 0 0 0 1px var(--line)}
.day .d{font:400 10px var(--f-data);color:var(--ash);letter-spacing:.06em}
.day .c{font:500 15px var(--f-text);margin-top:2px}
.day .e{font-size:10.5px;color:var(--ash);height:14px}
.day.L{background:rgba(138,180,248,.13)}.day.L .c{color:#bcd0ff}.day.E .c{color:var(--warn)}.day.R .c{color:var(--ash)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-top:10px}
.grid2 .pill,.foot .pill{width:100%}
.tick{flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--line2);margin-top:1px}
.tick.done{background:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{padding:8px 13px;border-radius:999px;background:rgba(239,237,232,.07);box-shadow:inset 0 0 0 1px var(--line);font-size:14px}
.chip span{color:var(--ash);margin-left:6px}
.skel{height:14px;border-radius:7px;background:#ffffff12;margin:10px 0}
.empty{color:var(--ash);font-size:14px;margin:4px 0}
.foot-note{padding:30px 0 0;text-align:center;font-family:var(--f-data);font-size:11px;color:var(--ash);letter-spacing:.04em}
/* dock: the chat bar keeps its own clear space */
#fade{position:fixed;left:0;right:0;bottom:0;height:calc(var(--dock,92px) + 56px);pointer-events:none;z-index:19;
  background:linear-gradient(to bottom,rgba(9,9,10,0) 0,rgba(9,9,10,.92) 44px,#09090a 56px)}
#dock{position:fixed;left:12px;right:12px;bottom:12px;z-index:20}
#cmd{display:flex;align-items:center;gap:8px;padding:7px 7px 7px 20px;border-radius:999px;background:linear-gradient(160deg,rgba(30,30,32,.92),rgba(18,18,20,.92));
  box-shadow:inset 0 1px 0 rgba(239,237,232,.14),inset 0 0 0 1px rgba(239,237,232,.09),0 0 30px -12px rgba(160,190,255,.3);transition:box-shadow .4s}
#cmd.thinking{box-shadow:inset 0 0 0 1px rgba(239,237,232,.3),0 0 40px -6px rgba(239,237,232,.3)}
#q{flex:1;min-width:0;background:none;border:0;outline:none;padding:10px 0;font-size:16px}
#q::placeholder{color:var(--ash)}
.ib{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(239,237,232,.1);transition:background .3s}
.ib.send{background:var(--paper);color:var(--void)}
.ib.rec{background:var(--signal);box-shadow:0 0 24px rgba(229,50,43,.7)}
.ib svg{width:20px;height:20px}
#micnote{font-family:var(--f-data);font-size:11px;letter-spacing:.04em;color:var(--mist);text-align:center;margin-top:6px;min-height:15px}
/* chat sheet */
.msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.m{max-width:88%;padding:11px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--paper);color:var(--void)}
.m.c{align-self:flex-start;background:rgba(239,237,232,.06);box-shadow:inset 0 0 0 1px var(--line2)}
.m .acts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.m .acts .pill{width:100%;white-space:normal;text-align:left;justify-content:flex-start;padding:10px 14px;line-height:1.3;height:auto}
@media (prefers-reduced-motion:reduce){h1.speak .w,.st,.sub{animation:none;opacity:1;filter:none;transform:none}.reveal{transition:none;opacity:1;transform:none;filter:none}}
</style>
</head>
<body>
<canvas id="env"></canvas><div class="vignette"></div>
<div class="shell" id="shell">
  <header class="bar" id="bar"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="6"/><rect x="8" y="8" width="8" height="8" rx="2.5" fill="currentColor"/></svg>Conductor</div>
    <div class="bar-r"><span class="clock" id="clock"></span><button class="tag" id="lensesBtn">Lenses</button></div></header>
  <section class="hero card" id="hero">
    <div class="who"><span class="ldot" id="ldot"></span><span id="live">Conductor</span></div>
    <h1 class="speak" id="speak"></h1>
    <p class="sub" id="sub"></p>
    <div class="chain" id="chain"></div>
    <div class="checked" id="checked"></div>
  </section>
  <section class="sec" id="focusSec" hidden><header><h2>Focus</h2><span class="meta" id="focusMeta">Swipe</span></header>
    <div class="deck" id="deck"></div><div class="dots" id="dots"></div></section>
  <section class="sec"><header><h2>Lenses</h2><span class="meta">Hold to move</span></header><div id="lenses"></div></section>
  <p class="foot-note" id="footnote"></p>
</div>
<div id="fade"></div>
<div id="dock"><form id="cmd" autocomplete="off">
  <input id="q" placeholder="Ask Conductor, or tell it what to do" enterkeyhint="send">
  <button type="button" class="ib" id="mic" aria-label="Hold to talk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button type="submit" class="ib send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
</form><div id="micnote"></div></div>
<script src="common.js"></script>
<script src="env.js"></script>
<script>
'use strict';
/* ---------- the person's rota and plans (same as traceytech.app) ---------- */
const DAY=864e5,at=(d,h,m=0)=>{const x=new Date(d);x.setHours(h,m,0,0);return x;};
const ROTA_FROM=new Date(2026,10,1);
const ROTA=('R,R,R,R,E0700-1600,E0700-1700,L1500-2400,L1500-2400,L1200-2100,E0900-1800,R,R,R,R,E0700-1600,E0700-1600,L1300-2400,L1500-2400,L1200-2100,E0900-1800,R,R,R,E0700-1500,E0700-1600,E0700-1600,L1500-2400,L1500-2400,L1200-2100,E0900-1800,'
 +'R,R,R,R,E0700-1700,E0700-1600,L1300-2400,L1500-2400,L1200-2100,E0900-1800,R,R,R,R,E0700-1600,E0700-1600,L1300-2400,L1500-2400,L1200-2100,E0900-1800,R,R,R,R,E0700-1700,E0700-1700,L1500-2400,L1300-2400,L1200-2100,E0900-1800,R,'
 +'R,R,R,E0700-1600,E0700-1600,L1300-2400,L1500-2400,L1200-2100,E0900-1800,R,R,R,R,E0700-1600,E0700-1700,L1500-2400,L1500-2400,L1200-2100,E0900-1800,R,R,R,R,E0700-1600,E0700-1600,L1300-2400,L1500-2400,L1200-2100,E0900-1800,R,R').split(',');
const ROTA_END=new Date(+ROTA_FROM+ROTA.length*DAY);
const CYC=['R','R','R','R','E0700-1600','E0700-1600','L1500-2400','L1500-2400','L1200-2100','E0900-1800'],CYC0=new Date(2027,1,3);
const SH_NAME={E:'Early',L:'Late',R:'Rest day'};
const LEAVE=[[new Date(2026,11,21),new Date(2027,0,3),'Annual leave'],[new Date(2027,6,17),new Date(2027,6,28),'Summer holiday']];
const TRIPS=[{key:'krakow',title:'Kraków with your wife',start:new Date(2027,2,11),days:4,where:'Kraków'},
  {key:'summer',title:'Summer holiday',start:new Date(2027,6,17),days:12},{key:'xmas',title:'Christmas',start:new Date(2026,11,25),days:1}];
function shiftOn(d){const day=new Date(new Date(d).setHours(0,0,0,0));let code,proj=false;
  const lv=LEAVE.find(l=>day>=l[0]&&day<=l[1]);if(lv)return {c:'R',name:lv[2],day,leave:true};
  if(day>=ROTA_FROM&&day<ROTA_END)code=ROTA[Math.round((day-ROTA_FROM)/DAY)];
  else{proj=true;const i=Math.round((day-CYC0)/DAY);code=CYC[((i%10)+10)%10];}
  const c=code[0];if(c==='R')return {c,name:SH_NAME.R,day,proj};
  const h=code.slice(1).split('-');return {c,name:SH_NAME[c],day,proj,start:at(day,+h[0].slice(0,2),+h[0].slice(2)),end:at(day,+h[1].slice(0,2),+h[1].slice(2))};}
const hhmm=d=>new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const dayName=d=>new Date(d).toLocaleDateString('en-GB',{weekday:'short'});
const shortDay=d=>new Date(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
const shiftTxt=s=>s.c==='R'?(s.leave?s.name:'Rest day'):`${s.name} ${hhmm(s.start)}–${hhmm(s.end).replace('00:00','24:00')}`;
function until(t){const m=Math.max(0,Math.round((t-Date.now())/6e4));return m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':'');}
function dueTxt(d){const t=new Date(d.length===10?d+'T00:00':d);if(isNaN(t))return d;const today=new Date();
  const dd=Math.round((new Date(t).setHours(0,0,0,0)-new Date(today).setHours(0,0,0,0))/DAY);
  const tm=d.length>10?' '+hhmm(t):'';return (dd<0?'Overdue':dd===0?'Today':dd===1?'Tomorrow':shortDay(t))+tm;}

/* ---------- lenses: each one is a small agent with one job ---------- */
const LENSES={
  schedule:{name:'Schedule',dot:'#8ab4f8'},replies:{name:'Replies',dot:'#ffa657'},lists:{name:'Lists',dot:'#3fb950'},
  inbox:{name:'Inbox',dot:'#bc8cff'},out:{name:'Out and about',dot:'#58a6ff'},voice:{name:'Voice notes',dot:'#ff7eb6'},
  trips:{name:'Trips and plans',dot:'#e3b341'},conns:{name:'Connections',dot:'#e5322b'}};
const DEFAULT_ORDER=Object.keys(LENSES);
const D={feed:null,feedErr:'',lists:null,voice:null,brief:null,links:{},briefBusy:false,chat:[],spoken:false};
function prefs(){let p={};try{p=JSON.parse((N&&N.lensPrefs&&N.lensPrefs())||'{}');}catch(e){}
  const order=(p.order||[]).filter(k=>LENSES[k]);DEFAULT_ORDER.forEach(k=>{if(!order.includes(k))order.push(k);});
  return {order,off:new Set(p.off||[])};}
function savePrefs(order){const p=prefs();try{N.setLensPrefs(JSON.stringify({order,off:[...p.off]}));}catch(e){}}
function learn(lens,action,text){api('POST','/api/conductor',{op:'event',lens,action,text});}

/* online meetings get a Join button and never directions */
const ONLINE=/https?:\/\/|meet\.google|zoom\.us|teams\.microsoft|teams\.live|microsoft teams|teams meeting|google meet|webex|whereby|skype|^\s*(online|virtual|remote|phone|phone call|call|video call|tbc)\s*$/i;
const joinOf=e=>(D.links&&D.links[e.id])||((String(e.where||'').match(/https:\/\/\S+/)||[])[0])||'';
const isOnline=e=>!!(joinOf(e)&&(!e.where||ONLINE.test(e.where)))||(!!e.where&&ONLINE.test(e.where));
const placeOf=e=>{const u=joinOf(e);return /meet\.google/.test(u)||/google meet/i.test(e.where)?'Google Meet':/zoom/i.test(u+e.where)?'Zoom':/teams/i.test(u+e.where)?'Microsoft Teams':/webex/i.test(u+e.where)?'Webex':'Online';};

function events(){const seen=new Set();return ((D.feed&&D.feed.events)||[]).filter(e=>{const k=e.title+'|'+e.start;if(seen.has(k)||e.rsvp==='declined')return false;seen.add(k);return true;})
  .map(e=>({...e,s:e.start?new Date(e.start):null,e2:e.end?new Date(e.end):null})).filter(e=>e.s);}
function clashWith(e){if(e.allDay)return null;const s=shiftOn(e.s);if(s.c==='R')return null;const end=e.e2||new Date(+e.s+36e5);return (e.s<s.end&&end>s.start)?s:null;}
function noteFor(k){const n=((D.brief&&D.brief.lens_notes)||[]).find(x=>x.lens===k);return n&&n.note?`<p class="agent">${esc(n.note)}</p>`:'';}
function joinBtn(e){const u=joinOf(e);if(!u)return '';const soon=+e.s-Date.now()<15*6e4&&(e.e2||e.s)>Date.now();
  return `<div class="grid2"><button class="pill${soon?' solid':''}" data-join="${esc(u)}">Join ${esc(placeOf(e))}</button></div>`;}
function evRow(e){const c=clashWith(e),on=isOnline(e);
  return `<div class="rowi"><div class="tm">${e.allDay?'Day':esc(hhmm(e.s))}</div><div class="b"><div>${esc(e.title)}</div>
    <div class="s">${on?`<span class="onl">● ${esc(placeOf(e))}</span>`:e.where?esc(e.where):''}</div>${c?`<div class="s crit">During your ${esc(c.name.toLowerCase())} shift</div>`:''}${on?joinBtn(e):''}</div></div>`;}

const R={};
R.schedule=()=>{const now=new Date(),s=shiftOn(now),ev=events();
  const today=ev.filter(e=>sameDay(e.s,now)&&(e.e2||e.s)>=now);const next=today.find(e=>!e.allDay);
  const title=next?`Next ${hhmm(next.s)} ${next.title}`:s.c!=='R'?`${s.name} shift ${now<s.start?'from '+hhmm(s.start):now<s.end?'until '+hhmm(s.end).replace('00:00','24:00'):'done'}`:'A clear day';
  let h=`<div class="ln-title">${esc(title)}</div>${noteFor('schedule')}`;
  h+=`<div class="rowi"><div class="tm">Shift</div><div class="b"><div>${esc(shiftTxt(s))}</div>${s.c!=='R'&&now<s.start?`<div class="s">Starts in ${esc(until(s.start))}</div>`:s.c!=='R'&&now<s.end?'<div class="s okc">On now</div>':''}</div></div>`;
  h+=today.length?today.map(evRow).join(''):'<p class="empty">Nothing else in the calendar today.</p>';
  const tmr=ev.filter(e=>sameDay(e.s,+now+DAY));if(tmr.length)h+=`<div class="rowi"><div class="tm">Tmrw</div><div class="b"><div>${esc(tmr.map(e=>(e.allDay?'':hhmm(e.s)+' ')+e.title).slice(0,3).join(' · '))}</div><div class="s">${esc(shiftTxt(shiftOn(+now+DAY)))}</div></div></div>`;
  let w='<div class="week">';for(let i=1;i<=7;i++){const d=new Date(+now+i*DAY),sh=shiftOn(d),n=ev.filter(e=>sameDay(e.s,d)).length;
    w+=`<div class="day ${sh.c}"><div class="d">${esc(dayName(d).toUpperCase())}</div><div class="c">${sh.leave?'AL':sh.c==='R'?'–':sh.c}</div><div class="e">${n?n+' ev':''}</div></div>`;}
  return {html:h+w+'</div>',n:today.length,crit:!!(next&&+next.s-now<15*6e4)};};
R.replies=()=>{const inv=(D.feed&&D.feed.invites)||[];if(!inv.length)return null;
  return {n:inv.length,html:`<div class="ln-title">${inv.length} invite${inv.length>1?'s':''} waiting</div>${noteFor('replies')}`+inv.slice(0,4).map(e=>`<div class="rowi" data-inv="${esc(e.id)}"><div class="b"><div>${esc(e.title)}</div><div class="s">${esc(e.allDay?shortDay(e.start):shortDay(e.start)+' '+hhmm(e.start))}${e.org?' · from '+esc(e.org):''}</div>
    <div class="grid2"><button class="pill solid" data-rsvp="accepted">Accept</button><button class="pill" data-rsvp="tentative">Maybe</button><button class="pill" data-rsvp="declined">Decline</button></div></div></div>`).join('')};};
R.lists=()=>{const L=D.lists;if(!L||!L.lists)return null;const open=(L.todos||[]).filter(t=>t.state==='open');
  const withItems=L.lists.map(l=>({l,items:open.filter(t=>t.list===l.id)})).filter(x=>x.items.length);if(!withItems.length)return null;
  const rank=t=>{const d=t.due?Date.parse(t.due.length===10?t.due+'T23:59':t.due):NaN;return isNaN(d)?9e15:d;};
  const top=open.slice().sort((a,b)=>rank(a)-rank(b)).slice(0,4);const nm=new Map(L.lists.map(l=>[l.id,l.name]));
  const late=open.filter(t=>rank(t)<Date.now()).length;
  return {n:open.length,crit:late>0,html:`<div class="ln-title">${late?late+' overdue':'To-do'}</div>${noteFor('lists')}<div class="big">${open.length}<small>open</small></div>
    <div class="chips">${withItems.map(x=>`<button class="chip" data-openlist="${x.l.id}">${esc(x.l.name)}<span>${x.items.length}</span></button>`).join('')}</div>`+
    top.map(t=>{const d=rank(t),lt=d<Date.now();return `<div class="rowi" data-todo="${t.id}"><button class="tick" data-tick="${t.id}" aria-label="Done"></button><div class="b"><div>${esc(t.text)}</div><div class="s">${esc(nm.get(t.list)||'')}${t.due?` · <span class="${lt?'crit':''}">${esc(dueTxt(t.due))}</span>`:''}</div></div></div>`;}).join('')};};
R.inbox=()=>{const m=((D.feed&&D.feed.emails)||[]).filter(x=>!x.bulk);if(!m.length)return null;
  return {n:m.length,html:`<div class="ln-title">${m.length} from real people</div>${noteFor('inbox')}`+m.slice(0,5).map(x=>`<div class="rowi" data-mail="${esc(x.thread||x.id)}"><div class="b"><div>${esc(x.subject||'(no subject)')}</div><div class="s">${esc(String(x.from||'').replace(/<.*>/,'').trim())} · ${esc(String(x.snippet||'').slice(0,90))}</div></div></div>`).join('')};};
R.out=()=>{const now=Date.now(),ev=events().filter(e=>e.where&&!isOnline(e)&&+e.s>now-36e5&&+e.s<now+36*36e5);
  const er=D.lists&&D.lists.lists?(()=>{const l=D.lists.lists.find(x=>x.cat==='town'||x.name==='Errands');return l?(D.lists.todos||[]).filter(t=>t.list===l.id&&t.state==='open'):[];})():[];
  if(!ev.length&&!er.length)return null;
  let h=`<div class="ln-title">${ev.length?'Next place: '+esc(ev[0].where.split(',')[0]):'Errands'}</div>${noteFor('out')}`;
  h+=ev.slice(0,2).map(e=>`<div class="rowi"><div class="tm">${esc(hhmm(e.s))}</div><div class="b"><div>${esc(e.title)}</div><div class="s">${esc(e.where)}${sameDay(e.s,now)?'':' · '+esc(shortDay(e.s))}</div>
    <div class="grid2"><button class="pill" data-dir="${esc(e.where)}">Directions</button></div></div></div>`).join('');
  if(er.length)h+=`<div class="rowi"><div class="b"><div>${er.length} errand${er.length>1?'s':''} to do while you're out</div><div class="s">${esc(er.slice(0,3).map(t=>t.text).join(' · '))}</div></div></div>`;
  return {html:h,n:ev.length+er.length};};
R.voice=()=>{const rows=((D.voice&&D.voice.rows)||[]).filter(n=>n.state==='pending'||Date.now()-Date.parse(n.created)<864e5);if(!rows.length)return null;
  const wait=rows.filter(n=>n.state==='pending').length;
  return {n:rows.length,crit:wait>0,html:`<div class="ln-title">${wait?wait+' waiting for your OK':'Today\'s notes'}</div>${noteFor('voice')}`+rows.slice(0,4).map(n=>`<div class="rowi" data-vn="${n.id}"><div class="b"><div>${esc(n.summary||n.title||n.transcript||'Voice note')}</div><div class="s">${esc(hhmm(n.created))}${n.state==='pending'?' · <span class="warnc">waiting for your OK</span>':''}</div>
    ${n.state==='pending'?`<div class="grid2">${n.intent==='calendar'?'<button class="pill solid" data-va="calendar">Add to calendar</button>':n.intent==='email'?'<button class="pill solid" data-va="email">Send email</button>':''}<button class="pill" data-va="todo">Make a to-do</button><button class="pill" data-va="dismiss">Dismiss</button></div>`:''}</div></div>`).join('')};};
R.trips=()=>{const now=new Date(),up=TRIPS.filter(t=>+t.start+t.days*DAY>now&&+t.start-now<200*DAY);if(!up.length)return null;let crit=false;
  const h=up.map(t=>{const d=Math.ceil((t.start-now)/DAY);let warn='';
    if(t.key==='krakow'){const w=[];for(let i=0;i<t.days;i++){const s=shiftOn(+t.start+i*DAY);if(s.c!=='R')w.push(s);}
      if(w.length)crit=true;warn=w.length?`<div class="s crit">You're due to work ${w.length} of the ${t.days} days. Request leave.</div>`:'<div class="s okc">Leave is sorted.</div>';}
    return `<div class="rowi"><div class="tm" style="width:70px;font:300 30px var(--f-text);letter-spacing:-.03em">${d<=0?'Now':d}</div><div class="b"><div>${esc(t.title)}</div><div class="s">${esc(shortDay(t.start))}${d>0?' · in '+d+' days':''}</div>${warn}</div></div>`;}).join('');
  return {n:up.length,crit,html:`<div class="ln-title">${esc(up[0].title)}</div>${noteFor('trips')}`+h};};
R.conns=()=>{const p=[];if(D.feedErr)p.push(['Google',D.feedErr]);if(D.feed&&D.feed.errors)Object.entries(D.feed.errors).slice(0,2).forEach(([k,v])=>p.push([k,v]));
  try{const s=JSON.parse(N.state());if(!s.signedIn)p.push(['TraceyTech','Not signed in']);if(s.fob&&s.fob.on&&!s.fob.connected)p.push(['Voice fob',s.fob.status]);}catch(e){}
  if(!p.length)return null;
  return {n:p.length,crit:true,html:`<div class="ln-title">Something needs fixing</div>`+p.map(([a,b])=>`<div class="rowi"><div class="b"><div>${esc(a)}</div><div class="s crit">${esc(String(b).slice(0,140))}</div></div></div>`).join('')+'<div class="grid2"><button class="pill" data-web="1">Fix in TraceyTech</button></div>'};};

/* ---------- Conductor: the hero, the focus deck and the scene ---------- */
const lensName=k=>LENSES[k]?LENSES[k].name:'Conductor';
let lastSpeak='';
function heroDraw(){const b=D.brief,now=new Date();
  $('#clock').textContent=hhmm(now);
  const crit=b&&b.tone==='urgent';$('#ldot').className='ldot'+(crit?' crit':'')+(D.briefBusy?' think':'');
  $('#live').textContent=D.briefBusy&&!b?'Conductor is thinking':'Conductor · '+now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  const head=b?b.headline:(()=>{const s=shiftOn(now);return s.c!=='R'&&now<s.end?(now<s.start?`${s.name} shift starts ${hhmm(s.start)}.`:`On shift until ${hhmm(s.end).replace('00:00','24:00')}.`):'A rest day.';})();
  if(head!==lastSpeak){lastSpeak=head;$('#speak').innerHTML=String(head).split(/\s+/).map((w,i)=>`<span class="w" style="animation-delay:${(i*.06).toFixed(2)}s">${esc(w)}</span>`).join(' ');}
  $('#sub').textContent=b&&b.summary||'';
  const st=(b&&b.steps||[]).slice(0,3);
  $('#chain').innerHTML=st.length?`<div class="ln"><i></i></div>`+st.map((s,i)=>`<button class="st${i===0?' now':''}${i===0&&crit?' crit':''}" data-step="${i}"><b>${i===0?'Now':i===1?'Next':'Then'}</b><span>${esc(s.text)}</span></button>`).join(''):(D.briefBusy?'<div class="skel" style="grid-column:1/-1;width:70%"></div>':'');
  $('#checked').innerHTML=b?`${D.briefBusy?'<i>Thinking…</i>':''}<span>Updated ${esc(b.at?hhmm(b.at):'')}</span>${b.engine==='claude'?`<i>Claude${b.passes>1?' · checked twice':''}</i>`:b.engine?'<i>Cloudflare AI</i>':''}${b.stale?'<i>last good brief</i>':''}`:'';
  $('#cmd').classList.toggle('thinking',D.briefBusy);if(window.Env)Env.thinkGoal=D.briefBusy?1:0;}

function cards(){const b=D.brief;if(!b)return [];const out=[];const ev=events();
  (b.steps||[]).forEach((s,i)=>{const e=s.ref&&ev.find(x=>x.id===s.ref);const m=e?Math.round((e.s-Date.now())/6e4):null;
    out.push({kind:'step',i,lens:s.lens,title:s.text,why:s.why,action:s.action,ref:s.ref,ev:e,state:m!=null&&m>-600?(m<=0?'Now':'In '+until(e.s)):'',crit:(m!=null&&m<=15&&m>-120)||(i===0&&b.tone==='urgent')});});
  (b.ideas||[]).forEach((x,i)=>out.push({kind:'idea',i,lens:'conductor',title:x.text,why:x.why,draft:x.draft}));
  return out;}
function cardActions(c){const a=[];
  if(c.kind==='idea'){if(c.draft)a.push(`<button class="pill solid" data-share="${c.i}">Send draft</button>`);a.push(`<button class="pill" data-idea-ok="${c.i}">Useful</button><button class="pill" data-idea-no="${c.i}">Not now</button>`);return a.join('');}
  const e=c.ev;
  if(e&&isOnline(e)&&joinOf(e))a.push(`<button class="pill solid" data-join="${esc(joinOf(e))}">Join ${esc(placeOf(e))}</button>`);
  else if(e&&e.where&&!isOnline(e))a.push(`<button class="pill solid" data-dir="${esc(e.where)}">Directions</button>`);
  if(/^mail:/.test(c.ref||''))a.push(`<button class="pill solid" data-mail="${esc(c.ref.slice(5))}">Open email</button>`);
  if(/^todo:/.test(c.ref||''))a.push(`<button class="pill solid" data-tick="${esc(c.ref.slice(5))}">Done</button>`);
  if(c.lens&&LENSES[c.lens])a.push(`<button class="pill" data-go="${esc(c.lens)}">${esc(lensName(c.lens))}</button>`);
  return a.join('');}
function deckDraw(){const cs=cards();$('#focusSec').hidden=!cs.length;if(!cs.length)return;
  $('#deck').innerHTML=cs.map(c=>`<article class="fc card${c.crit?' alert':''}" data-lensk="${esc(c.lens||'')}"><div class="eye"><span>${esc(c.kind==='idea'?'Idea':lensName(c.lens))}</span>${c.state?`<span class="state${c.crit?' crit':''}"><i></i>${esc(c.state)}</span>`:''}</div>
    <h3>${esc(c.title)}</h3>${c.why?`<p>${esc(c.why)}</p>`:''}${c.draft?`<div class="draft">${esc(c.draft)}</div>`:''}<div class="foot">${cardActions(c)}</div></article>`).join('');
  $('#dots').innerHTML=cs.map(()=>'<i></i>').join('');$('#focusMeta').textContent=cs.length+' to look at';deckFx();}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let deckI=-1;
function deckFx(){const deck=$('#deck');const r=deck.getBoundingClientRect();const mid=r.left+r.width/2;let best=0,bd=1e9;
  $$('.fc',deck).forEach((c,i)=>{const b=c.getBoundingClientRect();const o=(b.left+b.width/2-mid)/b.width;const a=Math.min(1.6,Math.abs(o));
    if(Math.abs(o)<bd){bd=Math.abs(o);best=i;}
    if(reduce){c.style.transform='';return;}
    c.style.transform=`translateZ(${-a*140}px) rotateY(${Math.max(-1.2,Math.min(1.2,o))*-22}deg) scale(${1-a*.06})`;
    c.style.filter=a>.15?`blur(${(a*3).toFixed(1)}px) brightness(${(1-a*.25).toFixed(2)})`:'none';c.style.opacity=(1-a*.35).toFixed(2);});
  if(best!==deckI){deckI=best;const c=$$('.fc',deck)[best];if(c&&window.Env)Env.look=c.dataset.lensk||null;}
  $$('#dots i').forEach((d,i)=>d.classList.toggle('on',i===best));}
$('#deck').addEventListener('scroll',()=>requestAnimationFrame(deckFx),{passive:true});

let shown={};
function lensesDraw(){const p=prefs();shown={};let h='';const src=[];
  for(const k of p.order){if(p.off.has(k))continue;let r=null;try{r=R[k]();}catch(e){console.error(k,e);}if(r==null)continue;shown[k]=r;
    src.push({id:k,n:r.n||1,crit:!!r.crit});
    h+=`<section class="lens card reveal${r.crit?' alert':''}" data-k="${k}"><div class="lh"><span class="dot" style="background:${LENSES[k].dot};color:${LENSES[k].dot}"></span><span class="k">${esc(LENSES[k].name)}</span><span class="grip" aria-hidden="true">⋮⋮</span></div><div class="lb">${r.html}</div></section>`;}
  $('#lenses').innerHTML=h||'<p class="empty" style="text-align:center">Every lens is quiet. Nothing needs you.</p>';
  if(window.Env){Env.setGraph(src);Env.crit=src.some(s=>s.crit)||!!(D.brief&&D.brief.tone==='urgent');}
  observe();}
let io=null;function observe(){if(!('IntersectionObserver' in window)){$$('.reveal').forEach(x=>x.classList.add('in'));return;}
  io=io||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.08});
  $$('.reveal:not(.in)').forEach(x=>io.observe(x));}
function render(){heroDraw();deckDraw();lensesDraw();
  $('#footnote').textContent='Each lens is an agent. Conductor reads them all'+(D.brief&&D.brief.signals?` · ${D.brief.signals.length} facts checked`:'');}

/* ---------- data ---------- */
function cached(k){try{const v=N&&N.cached(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function context(){const now=new Date(),sh=[],sd=[];for(let i=0;i<3;i++){const d=new Date(+now+i*DAY),s=shiftOn(d);sh.push((i===0?'Today':shortDay(d))+': '+shiftTxt(s)+(s.proj?' (projected)':''));
    if(s.c!=='R')sd.push({kind:s.c,start:s.start.toISOString(),end:s.end.toISOString()});}
  const y=shiftOn(+now-DAY);if(y.c!=='R'&&y.end>now)sd.unshift({kind:y.c,start:y.start.toISOString(),end:y.end.toISOString()});
  const trips=TRIPS.filter(t=>+t.start>now).map(t=>{let x=t.title+' from '+shortDay(t.start)+' for '+t.days+' days';if(t.key==='krakow'){let w=0;for(let i=0;i<t.days;i++)if(shiftOn(+t.start+i*DAY).c!=='R')w++;x+=w?`; due to work ${w} of those days, leave not booked`:'; leave sorted';}return x;});
  const p=prefs();return {shifts:sh,shiftsData:sd,trips,lenses:p.order.filter(k=>!p.off.has(k))};}
let loading=false;
async function load(fresh){if(loading)return;loading=true;
  const [f,l,v,c]=await Promise.all([api('GET','/api/google/feed'),api('GET','/api/lists'),api('GET','/api/voice'),api('GET','/api/conductor')]);
  if(f.ok){D.feed=f.json;D.feedErr='';}else if(f.code&&f.code!==401)D.feedErr=f.json.error||'Google is not answering';
  if(l.ok)D.lists=l.json;if(v.ok)D.voice=v.json;if(c.ok){D.links=c.json.links||D.links;if(c.json.brief&&!D.brief)D.brief=c.json.brief;}
  render();loading=false;brief(fresh);}
async function brief(fresh){if(D.briefBusy)return;D.briefBusy=true;heroDraw();
  const r=await api('POST','/api/conductor',{op:'brief',fresh:!!fresh,context:context()});D.briefBusy=false;
  if(r.ok&&r.json.headline){D.brief=r.json;if(r.json.links)D.links=r.json.links;render();}else heroDraw();}

/* ---------- taps ---------- */
document.addEventListener('click',async e=>{const b=e.target.closest('button,[data-mail]');if(!b)return;
  if(b.dataset.step!=null){const s=D.brief.steps[+b.dataset.step];const i=cards().findIndex(c=>c.kind==='step'&&c.i===+b.dataset.step);const el=$$('.fc')[i];
    if(el){$('#focusSec').scrollIntoView({behavior:'smooth',block:'start'});el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}learn(s.lens||'conductor','step_open');return;}
  if(b.dataset.go){learn(b.dataset.go,'open');const t=$(`[data-k="${b.dataset.go}"]`);if(t){t.classList.add('in');t.scrollIntoView({behavior:'smooth',block:'center'});t.animate([{boxShadow:'0 0 0 2px #efede8'},{boxShadow:'0 0 0 0 transparent'}],{duration:1400});}else if(b.dataset.go==='lists')N.open('lists');return;}
  if(b.dataset.join){learn('schedule','join');haptic();N.openUrl(b.dataset.join);return;}
  if(b.dataset.rsvp){const row=b.closest('[data-inv]'),inv=((D.feed&&D.feed.invites)||[]).find(x=>x.id===row.dataset.inv);$$('button',row).forEach(x=>x.disabled=true);haptic();
    const r=await api('POST','/api/google/rsvp',{id:row.dataset.inv,acct:inv&&inv.acct,response:b.dataset.rsvp});
    if(r.ok){learn('replies',b.dataset.rsvp);D.feed.invites=D.feed.invites.filter(x=>x.id!==row.dataset.inv);toast('<b>'+({accepted:'Accepted',tentative:'Marked as maybe',declined:'Declined'})[b.dataset.rsvp]+'.</b> The organiser has been told.');render();}
    else{$$('button',row).forEach(x=>x.disabled=false);toast(esc(r.json.needScope?'Allow calendar replies once at traceytech.app in Chrome.':(r.json.error||'Could not reply')));}return;}
  if(b.dataset.tick){const id=Number(b.dataset.tick);b.classList.add('done');b.disabled=true;haptic();const r=await api('POST','/api/lists',{op:'state',todo:id,state:'done'});
    if(r.ok){learn('lists','done');const t=(D.lists.todos||[]).find(x=>x.id===id);if(t)t.state='done';toast('Done');setTimeout(render,500);}else{b.classList.remove('done');b.disabled=false;toast('Could not tick that off');}return;}
  if(b.dataset.openlist){learn('lists','open');N.open('lists');return;}
  if(b.dataset.mail){learn('inbox','open');N.openUrl('https://mail.google.com/mail/u/0/#inbox/'+encodeURIComponent(b.dataset.mail));return;}
  if(b.dataset.dir){learn('out','directions');N.openUrl('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(b.dataset.dir));return;}
  if(b.dataset.va){const row=b.closest('[data-vn]');$$('button',row).forEach(x=>x.disabled=true);const r=await api('POST','/api/voice/act',{id:Number(row.dataset.vn),action:b.dataset.va});
    if(r.ok){learn('voice',b.dataset.va);toast(b.dataset.va==='dismiss'?'Dismissed':'Done');load();}else{$$('button',row).forEach(x=>x.disabled=false);toast(esc(r.json.error||'Could not do that'));}return;}
  if(b.dataset.web){N.open('site');return;}
  if(b.id==='lensesBtn'){N.open('settings');return;}
  if(b.dataset.share){const x=D.brief.ideas[+b.dataset.share];learn('conductor','share_draft');N.share('draft.txt','text/plain',x.draft);return;}
  if(b.dataset.ideaOk!=null){learn('conductor','idea_useful');b.closest('.fc').style.opacity=.5;toast('Thanks. Conductor will suggest more like this.');return;}
  if(b.dataset.ideaNo!=null){const x=D.brief.ideas[+b.dataset.ideaNo];learn('conductor','idea_dismissed',x&&x.text);D.brief.ideas.splice(+b.dataset.ideaNo,1);deckDraw();toast('Not now. Conductor will not suggest it again this week.');return;}
});

/* ---------- press and hold a lens to move it ---------- */
let drag=null;
document.addEventListener('touchstart',e=>{const lh=e.target.closest('.lens');if(!lh||e.target.closest('button,input'))return;
  const y=e.touches[0].clientY;clearTimeout(window._hold);
  window._hold=setTimeout(()=>{drag={el:lh,y0:y,dy:0};lh.classList.add('lift');try{window.ConductorPage&&ConductorPage.top(false);}catch(e){}haptic();document.body.style.overflow='hidden';},480);},{passive:true});
document.addEventListener('touchmove',e=>{if(!drag){clearTimeout(window._hold);return;}e.preventDefault();
  const y=e.touches[0].clientY;drag.dy=y-drag.y0;drag.el.style.transform=`translateY(${drag.dy}px) scale(1.02)`;
  const sibs=$$('.lens').filter(x=>x!==drag.el);const mid=drag.el.getBoundingClientRect();const c=mid.top+mid.height/2;
  for(const s of sibs){const r=s.getBoundingClientRect();
    if(drag.dy>0&&s.compareDocumentPosition(drag.el)&Node.DOCUMENT_POSITION_PRECEDING&&c>r.top+r.height/2){s.after(drag.el);drag.y0+=r.height+14;drag.dy=y-drag.y0;drag.el.style.transform=`translateY(${drag.dy}px) scale(1.02)`;haptic();break;}
    if(drag.dy<0&&s.compareDocumentPosition(drag.el)&Node.DOCUMENT_POSITION_FOLLOWING&&c<r.top+r.height/2){s.before(drag.el);drag.y0-=r.height+14;drag.dy=y-drag.y0;drag.el.style.transform=`translateY(${drag.dy}px) scale(1.02)`;haptic();break;}}
  if(y<80)scrollBy(0,-12);else if(y>innerHeight-160)scrollBy(0,12);},{passive:false});
function endDrag(){clearTimeout(window._hold);if(!drag)return;drag.el.classList.remove('lift');drag.el.style.transform='';document.body.style.overflow='';
  const vis=$$('.lens').map(x=>x.dataset.k),p=prefs();
  const order=[];let i=0;for(const k of p.order){order.push(vis.includes(k)?vis[i++]:k);}savePrefs(order);drag=null;toast('Order saved');}
document.addEventListener('touchend',endDrag);document.addEventListener('touchcancel',endDrag);

/* ---------- chat bar, typed or spoken ---------- */
function chatSheet(){const s=sheet(`<h2>Conductor</h2><div class="msgs" id="msgs"></div>`);drawChat();return s;}
function drawChat(){const m=$('#msgs');if(!m)return;m.innerHTML=D.chat.map((x,i)=>`<div class="m ${x.who==='me'?'me':'c'}">${esc(x.text)}${x.busy?'…':''}${(x.actions||[]).length?`<div class="acts">${x.actions.map((a,j)=>`<button class="pill${j?'':' solid'}" data-act="${i}:${j}">${esc(a.label)}</button>`).join('')}</div>`:''}${(x.actions||[]).filter(a=>a.type==='draft_email').map(a=>`<div class="draft" style="margin-top:8px">To: ${esc(a.to||'')}\nSubject: ${esc(a.subject||'')}\n\n${esc(a.body||'')}</div>`).join('')}</div>`).join('');
  const s=$('#sheet');if(s)s.scrollTop=s.scrollHeight;}
async function ask(text,spoken){text=String(text||'').trim();if(!text)return;learn('conductor',spoken?'chat_voice':'chat');
  D.chat.push({who:'me',text});const reply={who:'c',text:'Thinking',busy:true};D.chat.push(reply);if(!$('#sheet.on'))chatSheet();else drawChat();
  $('#cmd').classList.add('thinking');if(window.Env)Env.thinkGoal=1;
  const r=await api('POST','/api/conductor',{op:'chat',text,context:context(),history:D.chat.slice(0,-2).map(x=>({who:x.who,text:x.text}))});
  $('#cmd').classList.remove('thinking');if(window.Env)Env.thinkGoal=0;
  reply.busy=false;reply.text=r.ok?r.json.answer:(r.json.error||'Conductor is not answering. Try again.');reply.actions=r.ok?r.json.actions:[];drawChat();
  if(spoken&&r.ok&&N&&N.speak)N.speak(reply.text);}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const [i,j]=b.dataset.act.split(':').map(Number);const a=D.chat[i].actions[j];b.disabled=true;
  if(a.type==='add_todo'){const L=D.lists&&D.lists.lists||[];const l=L.find(x=>x.name.toLowerCase()===String(a.list||'').toLowerCase());
    const r=await api('POST','/api/lists',{op:'add',text:a.text||a.label,list:l?l.id:'auto'});toast(r.ok?'Added to '+esc(r.json.listName||(l&&l.name)||'your lists'):esc(r.json.error||'Could not add'));if(r.ok)load();}
  else if(a.type==='remember'){const r=await api('POST','/api/conductor',{op:'remember',text:a.text||a.label});toast(r.ok?'Conductor will remember that.':esc(r.json.error||'Could not save'));}
  else if(a.type==='draft_email'){N.openUrl('https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(a.to||'')+'&su='+encodeURIComponent(a.subject||'')+'&body='+encodeURIComponent(a.body||''));}
  else if(a.type==='join'&&a.url){N.openUrl(a.url);}
  else if(a.type==='open_lens'){closeSheet();const t=$(`[data-k="${a.lens}"]`);if(t){t.classList.add('in');t.scrollIntoView({behavior:'smooth',block:'center'});}else if(a.lens==='lists')N.open('lists');}
  learn('conductor','action_'+a.type);});
$('#cmd').addEventListener('submit',e=>{e.preventDefault();const q=$('#q');const t=q.value;q.value='';q.blur();ask(t,false);});
const mic=$('#mic');
mic.addEventListener('touchstart',e=>{e.preventDefault();if(!N||!N.micStart)return;N.stopSpeaking&&N.stopSpeaking();N.micStart();},{passive:false});
mic.addEventListener('touchend',e=>{e.preventDefault();N&&N.micStop&&N.micStop();},{passive:false});
mic.addEventListener('touchcancel',()=>{N&&N.micStop&&N.micStop();});
window.onMicState=(state,detail)=>{mic.classList.toggle('rec',state==='listening');$('#micnote').textContent=detail||'';if(window.Env)Env.thinkGoal=state==='listening'||state==='thinking'?1:0;
  if(state!=='listening'&&state!=='thinking')setTimeout(()=>{$('#micnote').textContent='';},4000);};
window.onMicText=t=>{$('#micnote').textContent='';if(t)ask(t,true);else toast('No speech heard. Hold the mic and speak.');};

function fitDock(){document.documentElement.style.setProperty('--dock',(innerHeight-$('#dock').getBoundingClientRect().top)+'px');}
addEventListener('resize',fitDock);
addEventListener('scroll',()=>{$('#bar').classList.toggle('solid',scrollY>innerHeight*.18);},{passive:true});
window.onNativeShow=()=>load(false);
window.onNativeReselect=()=>{window.scrollTo({top:0,behavior:'smooth'});load(true);};
window.onNativeChange=()=>{if(!drag&&!document.querySelector('.lift'))lensesDraw();};
D.feed=cached('feed');D.lists=cached('lists');D.voice=cached('voice');D.brief=cached('brief');if(D.brief&&D.brief.links)D.links=D.brief.links;
render();fitDock();load(false);
setInterval(()=>{if(document.visibilityState!=='visible')return;$('#clock').textContent=hhmm(new Date());
  if(D.brief&&D.brief.validUntil&&Date.now()>Date.parse(D.brief.validUntil)&&!D.briefBusy)brief(false);},30000);
</script>
</body>
